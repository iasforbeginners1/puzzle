<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient History: Book & Author Match</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f1ea;
            margin: 0;
            padding: 20px;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            background: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Responsive grid */
            grid-gap: 12px;
            max-width: 650px;
        }

        /* CARD CONTAINER: Base for the flipping effect */
        .card-container {
            width: 150px;
            height: 100px;
            perspective: 1000px; /* Essential for 3D flip */
            cursor: pointer;
        }

        /* CARD INNER: The element that actually rotates */
        .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
        }

        /* State when flipped */
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* BASE STYLE FOR BOTH FACES */
        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            -webkit-backface-visibility: hidden; /* For Safari */
            backface-visibility: hidden; /* Hide the back when it's facing away */
            border-radius: 8px;
            border: 2px solid #5d4037;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
            user-select: none;
        }

        /* FRONT FACE: Brown and Hidden Text */
        .card-front {
            background-color: #8d6e63;
            z-index: 2; /* Shows by default */
        }

        /* BACK FACE: White with Visible Text */
        .card-back {
            background-color: #ffffff;
            color: #3e2723;
            transform: rotateY(180deg); /* Text is already rotated 180deg relative to front */
            z-index: 1;
            font-size: 14px;
            font-weight: bold;
        }

        /* MATCHED STATE */
        .card-container.matched .card-back {
            background-color: #c8e6c9;
            color: #2e7d32;
            border-color: #2e7d32;
            cursor: default;
        }

        /* ERROR (Wrong Match) STATE */
        .card-container.error .card-back {
            background-color: #ffcdd2;
            border-color: #d32f2f;
        }

        #message {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #d32f2f;
            text-align: center;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #5d4037;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn:hover { background-color: #3e2723; }
    </style>
</head>
<body>

    <h1>Ancient History Match</h1>
    
    <div class="stats-container">
        <div>Time: <span id="timer">02:00</span></div>
        <div>Chances: <span id="chances">10</span></div>
    </div>

    <div class="game-board" id="board">
        <!-- Cards will be generated here -->
    </div>

    <div id="message"></div>
    <button class="btn" onclick="startGame()">Restart Game</button>

    <script>
        const pairs = [
            { text: "Arthashastra", id: 1 }, { text: "Chanakya", id: 1 },
            { text: "Indica", id: 2 }, { text: "Megasthenes", id: 2 },
            { text: "Mudrarakshasa", id: 3 }, { text: "Vishakhadatta", id: 3 },
            { text: "Rajatarangini", id: 4 }, { text: "Kalhana", id: 4 },
            { text: "Harshacharita", id: 5 }, { text: "Banabhatta", id: 5 },
            { text: "Mahabhashya", id: 6 }, { text: "Patanjali", id: 6 },
            { text: "Abhigyan Shakuntalam", id: 7 }, { text: "Kalidasa", id: 7 },
            { text: "Mrichchhakatika", id: 8 }, { text: "Shudraka", id: 8 }
        ];

        let flippedCards = [];
        let matchedPairs = 0;
        let chances = 10;
        let timeLeft = 120;
        let timerInterval;
        let gameActive = true;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function createCardElement(item) {
            // Container
            const cardContainer = document.createElement('div');
            cardContainer.classList.add('card-container');
            cardContainer.dataset.id = item.id;
            cardContainer.onclick = () => flipCard(cardContainer);

            // Inner (for animation)
            const cardInner = document.createElement('div');
            cardInner.classList.add('card-inner');

            // Front face (Brown, cover)
            const cardFront = document.createElement('div');
            cardFront.classList.add('card-face', 'card-front');
            cardFront.innerText = "?"; // Optional pattern

            // Back face (White, with text)
            const cardBack = document.createElement('div');
            cardBack.classList.add('card-face', 'card-back');
            cardBack.innerText = item.text;

            // Assemble
            cardInner.appendChild(cardFront);
            cardInner.appendChild(cardBack);
            cardContainer.appendChild(cardInner);

            return cardContainer;
        }

        function startGame() {
            gameActive = true;
            chances = 10;
            timeLeft = 120;
            matchedPairs = 0;
            flippedCards = [];
            document.getElementById('chances').innerText = chances;
            document.getElementById('message').innerText = '';
            
            // Clear and restart timer
            clearInterval(timerInterval);
            document.getElementById('timer').innerText = "02:00";
            startTimer();
            
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            const shuffledPairs = shuffle([...pairs]);
            shuffledPairs.forEach(item => {
                board.appendChild(createCardElement(item));
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`;
                
                if (timeLeft <= 0) {
                    endGame("Samay Khatam! (Time's Up!)");
                }
            }, 1000);
        }

        function flipCard(cardContainer) {
            if (!gameActive || flippedCards.length >= 2 || 
                cardContainer.classList.contains('flipped') || 
                cardContainer.classList.contains('matched')) {
                return;
            }

            cardContainer.classList.add('flipped');
            flippedCards.push(cardContainer);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.id === card2.dataset.id) {
                // Correct Match
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];

                if (matchedPairs === 8) {
                    endGame("Bahut Badhiya! Aap Itihas Ke Master Hain!");
                }
            } else {
                // Incorrect Match
                card1.classList.add('error');
                card2.classList.add('error');
                chances--;
                document.getElementById('chances').innerText = chances;

                if (chances <= 0) {
                    endGame("Chances Khatam! Koshish Karte Rahein.");
                } else {
                    // Flip back after a delay
                    setTimeout(() => {
                        card1.classList.remove('flipped', 'error');
                        card2.classList.remove('flipped', 'error');
                        flippedCards = [];
                    }, 1000);
                }
            }
        }

        function endGame(msg) {
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('message').innerText = msg;
        }

        // Initialize Game
        startGame();
    </script>
</body>
</html>
